[package]
name = "diskzap"
version = "0.3.0"
edition = "2021"
description = "Reclaims regenerable package caches, build artifacts and Docker cruft. Deletes only from an explicit catalog and reports by default, so cron or an AI agent can run it unattended."
license = "MIT"
repository = "https://github.com/longwind48/diskzap"
readme = "README.md"
keywords = ["cache", "disk", "cleanup", "storage", "prune"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "diskzap"
path = "src/main.rs"

[dependencies]
# Kept deliberately small so the whole tree stays auditable.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
