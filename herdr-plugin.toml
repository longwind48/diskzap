id = "longwind48.diskzap"
name = "diskzap"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Report and reclaim regenerable cache & build files. Reports first, deletes only on an explicit y."
platforms = ["linux", "macos"]

# Needs a Rust toolchain on the user's machine; herdr reports the failure if
# cargo is missing but will not install it.
[[build]]
command = ["cargo", "build", "--release"]

# The report is the product, so the pane is the primary surface — you read the
# number, then confirm. Placement is an overlay so it restores your layout.
[[panes]]
id = "report"
title = "diskzap — reclaimable space"
placement = "overlay"
command = ["bash", "herdr/pane.sh"]

# A glance, not a session. Popup rather than a pane: session-modal, no pane id,
# and it leaves the tiled layout alone. Scoped to the focused pane's directory,
# and read-only -- a thing you summon with one key should not be one key away
# from deleting a build you are still using.
[[panes]]
id = "here"
title = "diskzap — reclaimable here"
placement = "popup"
width = "70%"
height = 18
command = ["bash", "herdr/here.sh"]

# Registers the keybinding. An action rather than a bare script so it runs from
# the managed checkout after `herdr plugin install`, with no clone and no path
# guessing. Invoking it is the consent -- it still backs up config.toml first.
[[actions]]
id = "setup-keys"
title = "Register the diskzap keybinding"
contexts = ["workspace"]
command = ["bash", "install.sh", "--yes"]

[[actions]]
id = "here"
title = "Reclaimable in this directory"
contexts = ["workspace"]
command = ["bash", "herdr/open-here.sh"]

# Exists so the pane is reachable from a keybinding: herdr binds keys to
# actions, not to pane entrypoints.
[[actions]]
id = "report"
title = "Report reclaimable space"
contexts = ["workspace"]
command = ["bash", "herdr/open-report.sh"]
